<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CoinPulse is a cryptocurrency market tracker to explore live coin prices, market information, and your personal watchlist.">

    <title>CoinPulse - Crypto Market Tracker</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        };
    </script>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        #modalContent {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        #modalContent::-webkit-scrollbar {
            display: none;
        }

        body {
            transition: background-color 0.2s, color 0.2s;
        }
    </style>
</head>

<body class="bg-gray-100 text-gray-900 dark:bg-[#101116] dark:text-white min-h-screen">

    
    <nav class="bg-white dark:bg-[#191a20] border-b border-gray-200 dark:border-gray-800">
        <div class="max-w-[1500px] mx-auto px-5 py-4 flex items-center justify-between">

            <div class="flex items-center gap-3">
                <div class="bg-emerald-500 text-white w-10 h-10 rounded-xl flex items-center justify-center">
                    <i class="fa-solid fa-chart-line text-lg"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold">CoinPulse</h1>
                    <p class="text-xs text-gray-500 dark:text-gray-400">Crypto Market Tracker</p>
                </div>
            </div>

            <button id="themeBtn" aria-label="Toggle dark mode"
                class="w-10 h-10 rounded-xl bg-gray-100 dark:bg-[#292a32] hover:bg-gray-200 dark:hover:bg-[#373842]">
                <i id="themeIcon" class="fa-solid fa-moon"></i>
            </button>
        </div>
    </nav>

    <main class="max-w-[1500px] mx-auto px-5 py-7">

        
        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-7">
            <div>
                <h2 class="text-2xl md:text-3xl font-bold">Cryptocurrency Market</h2>
                <p class="text-gray-500 dark:text-gray-400 mt-1">
                    Track cryptocurrency prices and market information.
                </p>
            </div>

           <button id="refreshBtn" type="button"
                class="bg-emerald-500 hover:bg-emerald-600 text-white px-5 py-3 rounded-xl font-semibold">
                <i class="fa-solid fa-rotate-right mr-2"></i>
                Refresh Market
            </button>
        </div>

        
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-7">

            <div class="bg-white dark:bg-[#191a20] rounded-2xl p-5 border border-gray-200 dark:border-gray-800">
                <div class="flex justify-between">
                    <p class="text-gray-500 dark:text-gray-400">Total Coins</p>
                    <i class="fa-solid fa-coins text-emerald-500"></i>
                </div>
                <h2 id="totalCoins" class="text-2xl font-bold mt-3">--</h2>
            </div>

            <div class="bg-white dark:bg-[#191a20] rounded-2xl p-5 border border-gray-200 dark:border-gray-800">
                <div class="flex justify-between">
                    <p class="text-gray-500 dark:text-gray-400">Watchlist Coins</p>
                    <i class="fa-solid fa-star text-yellow-500"></i>
                </div>
                <h2 id="watchlistCount" class="text-2xl font-bold mt-3">0</h2>
            </div>

            <div class="bg-white dark:bg-[#191a20] rounded-2xl p-5 border border-gray-200 dark:border-gray-800">
                <div class="flex justify-between">
                    <p class="text-gray-500 dark:text-gray-400">Market Status</p>
                    <i class="fa-solid fa-circle-check text-emerald-500"></i>
                </div>
                <h2 id="marketStatus" class="text-2xl font-bold mt-3">Loading</h2>
            </div>

        </div>

        
        <div class="bg-white dark:bg-[#191a20] rounded-2xl p-4 border border-gray-200 dark:border-gray-800 mb-5">

            <div class="flex flex-col md:flex-row gap-3">

                <div class="relative flex-1">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 top-4 text-gray-400"></i>
                    <input id="searchInput" type="search"
                        placeholder="Search cryptocurrency..."
                        class="w-full bg-gray-100 dark:bg-[#25262e] rounded-xl pl-11 pr-4 py-3 outline-none focus:ring-2 focus:ring-emerald-500">
                </div>

                <select id="sortSelect"
                    class="bg-gray-100 dark:bg-[#25262e] rounded-xl px-4 py-3 outline-none">
                    <option value="market_cap_desc">Market Cap: High to Low</option>
                    <option value="market_cap_asc">Market Cap: Low to High</option>
                    <option value="price_desc">Price: High to Low</option>
                    <option value="price_asc">Price: Low to High</option>
                    <option value="change_desc">24h Change: High to Low</option>
                    <option value="change_asc">24h Change: Low to High</option>
                </select>

            </div>
        </div>

    
        <div class="flex gap-3 mb-5">
            <button id="homeTab"
                class="px-5 py-2.5 rounded-xl bg-emerald-500 text-white font-semibold">
                <i class="fa-solid fa-globe mr-2"></i>All Coins
            </button>

            <button id="watchlistTab"
                class="px-5 py-2.5 rounded-xl bg-white dark:bg-[#191a20] text-gray-600 dark:text-gray-300 font-semibold border border-gray-200 dark:border-gray-800">
                <i class="fa-solid fa-star mr-2"></i>Watchlist
            </button>
        </div>

        
        <div id="coinList"
            class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">

            <div class="col-span-full text-center py-12 text-gray-500">
                <i class="fa-solid fa-spinner fa-spin text-2xl mb-3"></i>
                <p>Loading market data...</p>
            </div>

        </div>

        
        <div class="flex justify-center mt-8">
            <button id="viewMoreBtn"
                class="hidden bg-emerald-500 hover:bg-emerald-600 text-white px-8 py-3 rounded-xl font-semibold transition">
                View More
                <i class="fa-solid fa-chevron-down ml-2"></i>
            </button>
        </div>

        <div id="messageBox" class="text-center text-gray-500 mt-6"></div>

        
        <div id="statusBox" class="hidden text-center py-10">
            <i id="statusIcon" class="fa-solid fa-circle-exclamation text-3xl text-red-500"></i>
            <p id="statusText" class="mt-3 text-gray-500"></p>
            <button id="retryBtn" class="mt-4 bg-emerald-500 text-white px-5 py-2 rounded-xl">
                Retry
            </button>
        </div>

    </main>

    
    <div id="coinModal"
        class="hidden fixed inset-0 z-50 bg-black/70 items-center justify-center p-3 sm:p-5">

        <div class="bg-white dark:bg-[#191a20] text-gray-900 dark:text-white
            rounded-2xl w-full max-w-xl max-h-[90vh]
            flex flex-col overflow-hidden shadow-2xl">

            <div class="flex items-center justify-between p-5 border-b border-gray-200 dark:border-gray-700 shrink-0">
                <h2 class="text-xl font-bold">Coin Details</h2>

                <button id="closeModal"
                    class="text-gray-500 hover:text-red-500 text-2xl">
                    &times;
                </button>
            </div>

            <div id="modalContent" class="p-5 min-h-0 overflow-y-auto">
                <p class="text-center text-gray-500">Loading...</p>
            </div>

        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
